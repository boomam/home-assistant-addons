name: Update Pangolin-CLI Version

on:
  schedule:
    - cron: "0 4 * * 5"   # run every Friday at 04:00 UTC
  workflow_dispatch:

jobs:
  pangolin-cli-update-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Get latest Pangolin-CLI release
        id: pangolin-cli
        run: |
          set -euo pipefail

          latest=$(curl -fsSL https://api.github.com/repos/fosrl/cli/releases/latest | jq -r '.tag_name // empty')
          latest=${latest#v}

          if [ -z "$latest" ]; then
            echo "ERROR: Could not determine latest Pangolin-CLI version"
            exit 1
          fi

          if ! [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: Invalid Pangolin-CLI version returned by GitHub: '$latest'"
            exit 1
          fi

          echo "Latest Pangolin-CLI version: $latest"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Get current version
        id: current
        run: |
          set -euo pipefail

          current=$(awk '/^[[:space:]]*PANGOLIN_CLI_VERSION:/ {print $2; exit}' pangolin-cli/build.yaml)

          if [ -z "$current" ] || [ "$current" = "null" ]; then
            echo "ERROR: Could not determine a valid current Pangolin-CLI version from build.yaml"
            echo "Found: '$current'"
            exit 1
          fi

          echo "Current Pangolin-CLI version: $current"
          echo "current=$current" >> "$GITHUB_OUTPUT"

      - name: Check if update is needed
        id: check
        run: |
          if [ "${{ steps.pangolin-cli.outputs.latest }}" = "${{ steps.current.outputs.current }}" ]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update build.yaml
        if: steps.check.outputs.update == 'true'
        run: |
          sed -i "s/^  PANGOLIN_CLI_VERSION:.*/  PANGOLIN_CLI_VERSION: ${{ steps.pangolin-cli.outputs.latest }}/" pangolin-cli/build.yaml

      - name: Update CHANGELOG.md
        if: steps.check.outputs.update == 'true'
        run: |
          set -euo pipefail

          old_version="${{ steps.current.outputs.current }}"
          new_version="${{ steps.pangolin-cli.outputs.latest }}"

          awk -v old="$old_version" -v new="$new_version" '
          BEGIN {
            updated = 0
          }

          /^# Change Log$/ {
            print
            print ""
            print "## Pangolin-CLI " new
            print "* Updated Pangolin-CLI from " old " to " new
            print ""
            updated = 1
            next
          }

          { print }

          END {
            if (updated == 0) {
              print "ERROR: Could not find '# Change Log' in pangolin-cli/CHANGELOG.md" > "/dev/stderr"
              exit 1
            }
          }
          ' pangolin-cli/CHANGELOG.md > pangolin-cli/CHANGELOG.tmp

          mv pangolin-cli/CHANGELOG.tmp pangolin-cli/CHANGELOG.md

          echo "Updated CHANGELOG.md from $old_version to $new_version"

      - name: Update config.yaml
        if: steps.check.outputs.update == 'true'
        run: |
          new_version="${{ steps.pangolin-cli.outputs.latest }}"
          sed -i "s/^version:.*/version: $new_version/" pangolin-cli/config.yaml

      - name: Verify updated files
        if: steps.check.outputs.update == 'true'
        run: |
          set -euo pipefail

          version=$(grep "^version:" pangolin-cli/config.yaml | awk '{print $2}')

          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "ERROR: config.yaml contains an invalid version: '$version'"
            exit 1
          fi

          if [ "$version" != "${{ steps.pangolin-cli.outputs.latest }}" ]; then
            echo "ERROR: config.yaml version '$version' does not match expected version '${{ steps.pangolin-cli.outputs.latest }}'"
            exit 1
          fi

          echo "config.yaml version verified: $version"

      - name: Commit changes
        if: steps.check.outputs.update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pangolin-cli/build.yaml pangolin-cli/CHANGELOG.md pangolin-cli/config.yaml
          git commit -m "Update Pangolin-CLI to ${{ steps.pangolin-cli.outputs.latest }}"
          git push

      - name: No update needed
        if: steps.check.outputs.update == 'false'
        run: echo "Pangolin-CLI is already up to date (version ${{ steps.current.outputs.current }})"
